name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, types, unit, integration and e2e
    runs-on: ubuntu-latest
    # адрес базы тестов зашит в конфигах (127.0.0.1:5436, miniapps_test) — сервис повторяет локальный docker-compose
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: miniapps
          POSTGRES_PASSWORD: miniapps
          POSTGRES_DB: miniapps_test
        ports:
          - 5436:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable

      - run: yarn typecheck

      - run: yarn lint

      - run: yarn format:check

      - run: yarn test:unit

      - run: yarn test:integration

      - run: yarn playwright install --with-deps chromium

      - run: yarn test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # один образ на все экземпляры (D41, D51); бизнес экземпляра задают база и переменные в Coolify
  image:
    name: Image
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      instances: ${{ steps.instances.outputs.instances }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/nikolaymurashkin/mrshkn-miniapps:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=miniapps
          cache-to: type=gha,mode=max,scope=miniapps

      # экземпляры со стендом — переменная репозитория COOLIFY_APPS: {"<slug>": "<uuid приложения>"}
      - id: instances
        env:
          COOLIFY_APPS: ${{ vars.COOLIFY_APPS || '{}' }}
        run: echo "instances=$(jq -c 'keys' <<< "$COOLIFY_APPS")" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy — ${{ matrix.instance }}
    needs: image
    if: needs.image.outputs.instances != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        instance: ${{ fromJSON(needs.image.outputs.instances) }}
    env:
      APP_UUID: ${{ fromJSON(vars.COOLIFY_APPS)[matrix.instance] }}
      COOLIFY_URL: https://coolify.mrshkn.com/api/v1
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - name: Deploy to Coolify
        run: |
          api() { curl -sS --fail-with-body -H "Authorization: Bearer $COOLIFY_TOKEN" -H 'Content-Type: application/json' "$@"; }
          api -X PATCH "$COOLIFY_URL/applications/$APP_UUID" -d "{\"docker_registry_image_tag\":\"$GITHUB_SHA\"}" > /dev/null
          deployment=$(api -X POST "$COOLIFY_URL/deploy?uuid=$APP_UUID" | jq -r '.deployments[0].deployment_uuid')
          echo "deployment $deployment"
          for _ in $(seq 60); do
            status=$(api "$COOLIFY_URL/deployments/$deployment" | jq -r .status)
            case $status in
              finished) exit 0 ;;
              failed | cancelled*) echo "status: $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo "status after 10 min: $status"
          exit 1
